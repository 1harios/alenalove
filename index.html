<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alёnagram">
  <title>Алёнка, с днём рождения! 🎂</title>
  <meta name="description" content="У тебя новая история 💌">

  <!-- Превью ссылки в Telegram/WhatsApp. Если адрес сайта другой — поменяй ссылку на картинку -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="У тебя 1 новая история 💌">
  <meta property="og:description" content="Алёнка, открой — это для тебя ✨">
  <meta property="og:image" content="https://1harios.github.io/alenalove/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preload" href="assets/fonts/pacifico-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Профиль -->
    <main id="profile" class="profile" aria-label="Профиль"></main>

    <!-- Лента публикаций (открывается по тапу на фото) -->
    <section id="feedView" class="feed-view" hidden aria-label="Публикации"></section>

    <!-- Истории -->
    <section id="viewer" class="viewer" hidden aria-label="Истории">
      <div class="stage" id="stage">
        <div class="slides"></div>
        <div class="v-top">
          <div class="bars"></div>
          <div class="v-head">
            <div class="v-ava"></div>
            <div class="v-name"></div>
            <div class="v-time"></div>
            <div class="grow"></div>
            <div class="v-music"></div>
            <button class="v-btn" data-act="sound" aria-label="Звук"></button>
            <button class="v-btn" data-act="close" aria-label="Закрыть"></button>
          </div>
        </div>
        <div class="v-loader" aria-hidden="true"></div>
        <div class="v-paused" aria-hidden="true"></div>
        <button class="v-next" hidden></button>
      </div>
      <div class="v-bottom">
        <button class="v-reply"></button>
        <button class="v-btn v-like" aria-label="Нравится"></button>
        <button class="v-btn v-send" aria-label="Поделиться"></button>
      </div>
      <div class="sheet" hidden>
        <div class="sheet__backdrop"></div>
        <div class="sheet__panel">
          <div class="sheet__title">Быстрые реакции</div>
          <div class="quick">
            <button data-e="😂">😂</button>
            <button data-e="😮">😮</button>
            <button data-e="😍">😍</button>
            <button data-e="😢">😢</button>
            <button data-e="👏">👏</button>
            <button data-e="🔥">🔥</button>
            <button data-e="🎉">🎉</button>
            <button data-e="💯">💯</button>
          </div>
          <form class="reply-form" autocomplete="off">
            <input type="text" enterkeyhint="send" maxlength="500" aria-label="Сообщение">
            <button type="submit">Отправить</button>
          </form>
        </div>
      </div>
    </section>

    <!-- Экран блокировки с уведомлением -->
    <section id="lock" class="lock" aria-label="Экран блокировки"></section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <noscript>
    <p style="padding:24px;font:16px/1.4 system-ui;text-align:center">Включи JavaScript, чтобы открыть поздравление 💌</p>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/emoji-map.js"></script>
  <script src="js/key.js"></script>
  <script src="js/core.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
